<!DOCTYPE html>
<html lang="en" data-frame-kind="sandboxed">
<head>
  <meta charset="utf-8" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'sha256-rwp+bUMHXITOWeRtiBsNNF1YBK0Gbjh7sN8qcLNAWdI='; style-src 'unsafe-inline'; base-uri 'none'; form-action 'none'" />
  <title>SOP Lab Sandboxed Frame</title>
  <style>
    body{font-family:system-ui,sans-serif;margin:0;padding:10px}
    .box{padding:10px;background:#fff6e5;border:1px solid #ffd79c;border-radius:10px}
  </style>
</head>
<body>
  <div class="box">
    <h3>Sandboxed iframe</h3>
    <p>Without <code>allow-same-origin</code>, this frame has an opaque origin.</p>
  </div>
  <script>window.addEventListener('message',(event)=>{if(event.source!==parent)return;const targetOrigin=event.origin==='null'?'*':event.origin;parent.postMessage({from:'sandboxed-frame',echo:event.data},targetOrigin);});</script>
</body>
</html>
